name: Android release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    container:
      image: barichello/godot-ci:4.7.1@sha256:622e5ca81b54cd8038ecf7de5d157b47efc800d7cf635af2eec18a6aee4bab7e
    steps:
      - uses: actions/checkout@v7
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure Godot container
        run: |
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          mv /root/.config/godot "$HOME/.config/godot"
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Verify public source tree
        run: tools/check_public_tree.sh
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "${KEYSTORE_BASE64}" || { echo "Missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "${KEYSTORE_ALIAS}" || { echo "Missing ANDROID_KEYSTORE_ALIAS" >&2; exit 1; }
          test -n "${KEYSTORE_PASSWORD}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > /tmp/musirail-release.keystore
          chmod 600 /tmp/musirail-release.keystore
          keytool -list \
            -keystore /tmp/musirail-release.keystore \
            -alias "${KEYSTORE_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" >/dev/null
      - name: Set Android version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          sed -i -E "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i -E "s/^version\/name=.*/version\/name=\"${version_name}\"/" export_presets.cfg
      - name: Export signed release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/musirail-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --path . --export-release Android "build/musirail-${GITHUB_REF_NAME}.apk"
          sha256sum "build/musirail-${GITHUB_REF_NAME}.apk" > "build/musirail-${GITHUB_REF_NAME}.apk.sha256"
          apksigner verify --verbose --print-certs "build/musirail-${GITHUB_REF_NAME}.apk"
      - uses: actions/attest@v4
        with:
          subject-path: build/musirail-*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: musirail-${{ github.ref_name }}
          path: build/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove signing keystore
        if: always()
        run: rm -f /tmp/musirail-release.keystore

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: musirail-${{ github.ref_name }}
          path: build
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" build/* --repo "${GITHUB_REPOSITORY}" --clobber
